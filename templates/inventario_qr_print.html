<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR — {{ estante.nombre }}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; padding: 24px;
        }
        .print-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 40px;
            text-align: center;
            max-width: 380px;
            width: 100%;
        }
        .almacen-label {
            font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em;
            color: #3b82f6; text-transform: uppercase; margin-bottom: 4px;
        }
        .estante-name {
            font-size: 2rem; font-weight: 800; color: #111;
            margin-bottom: 4px; line-height: 1.2;
        }
        .estante-desc {
            font-size: 0.9rem; color: #666; margin-bottom: 24px;
        }
        .qr-container {
            display: flex; justify-content: center; margin-bottom: 16px;
        }
        .qr-container img {
            width: 210px; height: 210px;
            border-radius: 8px;
            border: 3px solid #3b82f6;
            padding: 8px;
        }
        .qr-code-text {
            font-size: 0.6rem; color: #aaa; word-break: break-all;
            margin-bottom: 24px; font-family: monospace;
        }
        .btn-print {
            display: inline-flex; align-items: center; gap: 8px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white; border: none; padding: 14px 32px;
            border-radius: 12px; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
            margin-bottom: 12px; width: 100%; justify-content: center;
        }
        .btn-print:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,0.35); }
        .btn-back {
            display: inline-block; color: #666; text-decoration: none;
            font-size: 0.9rem; margin-top: 8px;
        }
        .btn-back:hover { color: #333; }

        /* ── Imprimir la tarjeta con diseño fiel ────────────────────────── */
        @media print {
            @page {
                size: auto;
                margin: 1cm;
            }
            html, body {
                background: white !important;
                display: block !important;
                padding: 0 !important;
                margin: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            body > *:not(.print-card) { display: none !important; }
            .print-card {
                background: white !important;
                border: 1px solid #cbd5e1 !important; /* Borde sutil para simular la tarjeta */
                border-radius: 16px !important;
                margin: 0 auto !important; /* Centrado horizontal */
                padding: 40px !important;
                width: 380px !important;
                max-width: 100% !important;
                text-align: center !important;
                box-shadow: none !important;
                display: block !important;
            }
            .almacen-label {
                display: block !important;
                font-size: 0.75rem !important; 
                font-weight: 700 !important; 
                letter-spacing: 0.12em !important;
                color: #3b82f6 !important; 
                text-transform: uppercase !important; 
                margin-bottom: 4px !important;
            }
            .estante-name {
                display: block !important;
                font-size: 2rem !important; 
                font-weight: 800 !important; 
                color: #111 !important;
                margin-bottom: 4px !important; 
                line-height: 1.2 !important;
            }
            .estante-desc {
                display: block !important;
                font-size: 0.9rem !important; 
                color: #666 !important; 
                margin-bottom: 24px !important;
            }
            .qr-container {
                display: flex !important; 
                justify-content: center !important; 
                margin-bottom: 16px !important;
            }
            .qr-container img {
                display: block !important;
                width: 210px !important; 
                height: 210px !important;
                border-radius: 8px !important;
                border: 3px solid #3b82f6 !important;
                padding: 8px !important;
                max-width: none !important;
            }
            .qr-code-text {
                display: block !important;
                font-size: 0.6rem !important; 
                color: #aaa !important; 
                word-break: break-all !important;
                margin-bottom: 0 !important;
                font-family: monospace !important;
            }
            .btn-print, .btn-back { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="print-card">
        <p class="almacen-label">{{ estante.almacen.nombre }}</p>
        <h1 class="estante-name">{{ estante.nombre }}</h1>
        {% if estante.descripcion %}
        <p class="estante-desc">{{ estante.descripcion }}</p>
        {% else %}
        <p class="estante-desc" style="color:#ccc;">Sin descripción</p>
        {% endif %}
        
        <div class="qr-container">
            <img src="/api/v1/estantes/{{ estante.id }}/qr-image" alt="QR {{ estante.nombre }}">
        </div>
        
        <p class="qr-code-text">{{ estante.qr_code }}</p>
        
        <button id="btn-print" class="btn-print">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                <rect x="6" y="14" width="12" height="8"/>
            </svg>
            Imprimir QR
        </button>
        <a href="/inventario/web" class="btn-back">← Volver al inventario</a>
    </div>
    <script src="/static/js/qr_print.js"></script>
</body>
</html>
