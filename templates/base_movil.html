<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>{% block title %}Escáner Móvil{% endblock %} — Skilled</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" href="{{ url_for('static', filename='icono.ico') }}" type="image/x-icon">
    
    <!-- PWA Config -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#2563eb">
    
    <!-- iOS / iPhone Specific -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Skilled">
    <link rel="apple-touch-icon" sizes="256x256" href="{{ url_for('static', filename='imagenes/256.png') }}">
    <link rel="apple-touch-icon" sizes="512x512" href="{{ url_for('static', filename='imagenes/512.png') }}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{{ url_for('static', filename='js/tailwind-config.js') }}"></script>
    <style>
        /* El CSS de cada vista define su propio body */
        body {
            margin: 0;
        }
    </style>
    {% block head %}{% endblock %}
</head>

<body class="min-h-screen">
    {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='js/session_interceptor.js') }}?v=5"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js')
                    .then(reg => console.log('SW Registered', reg))
                    .catch(err => console.log('SW Registration failed', err));
            });
        }
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
