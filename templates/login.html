<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Skilled | Iniciar Sesión</title>
    <link rel="icon" href="{{ url_for('static', filename='icono.ico') }}" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css?v=20">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}?v=2">
</head>

<body>
    <div class="login-wrapper">
        <!-- Left Brand Panel -->
        <div class="brand-panel">
            <h2>Bienvenido a</h2>
            <img src="{{ url_for('static', filename='imagenes/skilled (1).png') }}"
                alt="Skilled Proyectos Industriales">
            <p>Sistema integral de administración de personal, control de asistencia, nóminas y gestión de proyectos.
            </p>
        </div>

        <!-- Right Form Panel -->
        <div class="form-panel">
            <h3>Ingresa a tu cuenta</h3>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="input-group">
                    <label for="username">Usuario</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" placeholder="Ingresa tu nombre de usuario"
                            required autofocus>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña"
                            required>
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember" style="margin:0; font-weight: normal;">Recordarme en este equipo</label>
                </div>

                <div class="buttons-container">
                    <button type="submit" class="btn-login">Iniciar Sesión</button>
                    <!-- Simulated secondary action fitting the reference image's "Sign Up" button style -->
                    <a href="#" id="contact-admin" class="btn-link">¿Olvidaste tu contraseña?</a>
                </div>
            </form>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="alert-message"><i class="fa-solid fa-circle-exclamation" style="margin-right:5px;"></i> {{
                messages[0] }}</div>
            {% endif %}
            {% endwith %}
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/no_dblclick.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
