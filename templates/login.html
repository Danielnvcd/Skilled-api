<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Skilled | Iniciar Sesión</title>
    <link rel="icon" href="{{ url_for('static', filename='icono.ico') }}" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #546e7a;
            --primary-hover: #455a64;
            --bg-color: #FFFFFF;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-secondary: #64748B;
            --border-color: #E2E8F0;
            --input-bg: #F8FAFC;
            --focus-ring: rgba(84, 110, 122, 0.2);
            --error-bg: #FEF2F2;
            --error-text: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #bdc3c7 0%, #ecf0f1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--text-main);
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
        }

        .login-card {
            background: var(--card-bg);
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            width: 100%;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        h2 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 36px;
        }

        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper img {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px 14px 45px;
            font-size: 15px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        button.btn-login {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            font-size: 15px;
            font-weight: 500;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 8px;
        }

        button.btn-login:hover {
            background-color: var(--primary-hover);
        }

        .alert-message {
            margin-top: 24px;
            padding: 12px 16px;
            background-color: var(--error-bg);
            border: 1px solid #FECACA;
            color: var(--error-text);
            font-size: 14px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <img src="{{ url_for('static', filename='imagenes/skilled (1).png') }}" alt="Sistema de Nóminas"
                style="max-width: 160px; margin-bottom: 25px; mix-blend-mode: multiply;">
            <p class="subtitle">Ingresa a tu cuenta</p>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <div class="input-wrapper">
                        <img src="{{ url_for('static', filename='iconos/usuario.png') }}" alt="Usuario">
                        <input type="text" id="username" name="username" required autofocus>
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <img src="{{ url_for('static', filename='iconos/contraseña.png') }}" alt="Contraseña">
                        <input type="password" id="password" name="password" required>
                    </div>
                </div>

                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>
            <div style="margin-top: 20px; font-size: 14px; text-align: center;">
                <a href="#" id="contact-admin" style="color: var(--text-secondary); text-decoration: none;">¿Olvidaste
                    tu contraseña?</a>
            </div>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="alert-message">{{ messages[0] }}</div>
            {% endif %}
            {% endwith %}
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
