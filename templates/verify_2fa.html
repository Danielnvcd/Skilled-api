{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/two_factor.css') }}?v=31">

<div class="two-factor-wrapper">
    <div class="two-factor-card" style="max-width: 450px; margin: 0 auto;">
        <div class="two-factor-header">
            <div class="two-factor-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h3 class="main-title">Verificación de Seguridad</h3>
            <p class="subtitle">Abre tu aplicación de autenticación e ingresa el código de 6 dígitos.</p>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group" style="margin-bottom: 2rem;">
                <input type="text" name="code" class="code-input" placeholder="000 000" maxlength="6" required
                    autocomplete="off" autofocus>
            </div>
            <button type="submit" class="btn-primary">
                Verificar Código
            </button>
        </form>
    </div>
</div>
<script src="{{ url_for('static', filename='js/2fa.js') }}"></script>
{% endblock %}
