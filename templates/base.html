<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Sistema de Nóminas</title>
    <link rel="icon" href="{{ url_for('static', filename='icono.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.6) 40%, rgba(255, 255, 255, 0.0) 100%),
            url("{{ url_for('static', filename='imagenes/fondo.jpg') }}");
            background-size: cover;
            background-position: top center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #222;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #cfd8dc 0%, #ffffff 100%);
            border-right: 1px solid #e2e8f0;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            padding: 25px;
            flex-shrink: 0;
            z-index: 10;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 40px;
            text-align: center;
            color: #37474f;
        }

        .logo span {
            color: #546e7a;
        }

        .menu a {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 5px;
            color: #455a64;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
            font-weight: 500;
        }

        .menu-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            object-fit: contain;
        }

        .menu a:hover {
            background: linear-gradient(90deg, #cfd8dc 0%, #eceff1 100%);
            color: #263238;
            border-left: 4px solid #455a64;
            transform: translateX(5px);
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.05);
        }

        .menu {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            margin-bottom: 10px;
            padding-right: 5px;
        }

        .user-info {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid #cfd8dc;
            font-size: 0.9em;
            color: #546e7a;
        }

        .btn-logout {
            background: none;
            border: none;
            padding: 5px 0 0 0;
            cursor: pointer;
            color: #78909c;
            text-decoration: underline;
            font-weight: 500;
            font-size: 0.9em;
            font-family: inherit;
            display: block;
            width: 100%;
            text-align: left;
            margin-top: 5px;
            text-transform: none;
        }

        .btn-logout:hover {
            color: #37474f;
            text-decoration: underline;
            background: none !important;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.2);
        }

        .alert {
            background-color: #eceff1;
            color: #37474f;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            border-left: 5px solid #546e7a;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            padding: 20px;
            transition: 0.3s;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="logo">
            <img src="{{ url_for('static', filename='imagenes/skilled (1).png') }}" alt="Sistema de Nóminas"
                style="max-width: 180px; height: auto; mix-blend-mode: multiply; filter: contrast(1.1); margin-bottom: 10px;">
        </div>
        <nav class="menu">
            <a href="{{ url_for('main.home') }}">
                <img src="{{ url_for('static', filename='iconos/inicio.png') }}" class="menu-icon" alt="Inicio"> Inicio
            </a>
            <!-- Add more links here later -->
            <a href="{{ url_for('main.trabajadores') }}">
                <img src="{{ url_for('static', filename='iconos/trabajadores.png') }}" class="menu-icon"
                    alt="Trabajadores"> Trabajadores
            </a>
            <a href="{{ url_for('main.credenciales') }}">
                <img src="{{ url_for('static', filename='iconos/credenciales.png') }}" class="menu-icon"
                    alt="Credenciales"> Credenciales
            </a>
            <a href="{{ url_for('main.prenomina') }}">
                <img src="{{ url_for('static', filename='iconos/prenomina.png') }}" class="menu-icon" alt="Prenómina">
                Prenómina
            </a>
            <a href="{{ url_for('main.supervisores') }}">
                <img src="{{ url_for('static', filename='iconos/horario.png') }}" class="menu-icon" alt="Supervisores">
                Supervisores
            </a>
        </nav>
        <div class="user-info">
            <p>Usuario: <a href="{{ url_for('auth.profile') }}"
                    style="color: #546e7a; text-decoration: none; font-weight: bold;">{{ session.get('user', 'Invitado')
                    }}</a></p>
            <p>Rol: <span style="text-transform: capitalize;">{{ session.get('role', 'Ninguno') }}</span></p>

            <form method="POST" action="{{ url_for('auth.logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="btn-logout">Cerrar Sesión</button>
            </form>
        </div>
    </div>

    <div class="main-content">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="alert">{{ messages[0] }}</div>
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>

</html>
